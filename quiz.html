<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HL7 FHIR Quiz</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background-color: #f9f9f9; }
    .question { background: #fff; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    button { display: block; margin: 5px 0; padding: 10px; width: 100%; text-align: left; border: 1px solid #ccc; border-radius: 5px; background: #f1f1f1; cursor: pointer; }
    button.correct { background-color: #c8e6c9; border-color: #2e7d32; color: #2e7d32; }
    button.incorrect { background-color: #ffcdd2; border-color: #c62828; color: #c62828; }
    .explanation { margin-top: 10px; font-style: italic; }
  </style>
</head>
<body>

<h1>HL7 FHIR Certification Practice Quiz</h1>
<div id="quiz"></div>

<script>
const questions = [
  {
    question: "Which of the following is NOT an advantage of FHIR over older HL7 standards?",
    options: ["A) Built on modern web standards like JSON and REST", "B) Offers human-readable serialization formats", "C) Requires use of XML only for interoperability", "D) Easily extensible with profiles and extensions", "E) Includes a strong focus on real-world implementation"],
    correctAnswer: "C",
    explanation: "FHIR supports multiple formats including JSON, XML, and RDF. It does not require XML only."
  },
  {
    question: "What is the role of a BackboneElement in FHIR?",
    options: ["A) A type of standalone reusable FHIR resource", "B) A data type that supports value sets and terminology binding", "C) A container for complex elements within a resource (e.g. Patient.contact)", "D) A FHIR API endpoint definition", "E) A structure used only in extension profiles"],
    correctAnswer: "C",
    explanation: "BackboneElement is used for grouping complex nested elements inside a resource."
  },
  {
    question: "Which of the following FHIR versions is the most widely used in real-world implementation?",
    options: ["A) DSTU 1", "B) DSTU 2", "C) STU 3", "D) R4", "E) R5"],
    correctAnswer: "D",
    explanation: "R4 is the most stable and widely implemented version in production systems."
  },
  {
    question: "Which key feature of FHIR allows implementers to declare which parts of a resource are used and how?",
    options: ["A) CapabilityStatement", "B) Extension", "C) StructureDefinition", "D) Profile", "E) ValueSet"],
    correctAnswer: "D",
    explanation: "Profiles are used to constrain and tailor FHIR resources for specific use cases."
  },
  {
    question: "In FHIR, what does the 'given' element in HumanName represent?",
    options: ["A) Only the first name", "B) Only the middle name", "C) The full legal name", "D) First and middle names", "E) Suffix titles like Jr., Sr."],
    correctAnswer: "D",
    explanation: "The 'given' field may include both first and middle names."
  },
  {
    question: "What does the cardinality 0..* mean in a FHIR element?",
    options: ["A) Element must appear at least once", "B) Element is optional and repeats", "C) Element must appear exactly once", "D) Element is mandatory but cannot repeat", "E) Element is deprecated"],
    correctAnswer: "B",
    explanation: "It means the element is optional and may appear multiple times."
  },
  {
    question: "What is the purpose of the CapabilityStatement resource?",
    options: ["A) It stores patient allergies", "B) It defines terminology bindings", "C) It describes what a FHIR server is capable of", "D) It validates XML documents", "E) It logs patient consent history"],
    correctAnswer: "C",
    explanation: "CapabilityStatement describes the supported interactions and resources of a FHIR server."
  },
  {
    question: "What does the FHIR RESTful API use to retrieve a resource by ID?",
    options: ["A) POST /ResourceType", "B) GET /ResourceType", "C) GET /ResourceType/{id}", "D) PUT /ResourceType", "E) PATCH /ResourceType/{id}"],
    correctAnswer: "C",
    explanation: "GET /ResourceType/{id} is used to retrieve a specific resource instance."
  },
  {
    question: "Which of the following is a primary reason for FHIR’s rapid adoption in healthcare?",
    options: ["A) It replaces HL7 V2 messaging", "B) It is only used in mobile apps", "C) It offers simple, modern API-based exchange methods", "D) It guarantees data privacy", "E) It uses YAML exclusively"],
    correctAnswer: "C",
    explanation: "FHIR uses REST APIs and JSON, making it easy to implement and widely adopted."
  },
  {
    question: "What does the element name 'deceased[x]' indicate in FHIR?",
    options: ["A) Deprecated field", "B) Repeating field", "C) Optional modifier", "D) It allows choice of data types", "E) Internal-only element"],
    correctAnswer: "D",
    explanation: "The [x] notation indicates the element accepts multiple data types."
  },
  {
    question: "Which module category includes 'Security & Privacy'?",
    options: ["A) Content", "B) Clinical", "C) Diagnostics", "D) Infrastructure", "E) Reasoning"],
    correctAnswer: "D",
    explanation: "'Security & Privacy' is part of the Infrastructure module group."
  },
  {
    question: "Which of these elements is always case-sensitive in FHIR?",
    options: ["A) Narrative text", "B) Resource names", "C) All string values", "D) URLs only", "E) Codes from external systems"],
    correctAnswer: "B",
    explanation: "Resource names and element names are case-sensitive."
  },
  {
    question: "Which of the following elements is NOT typically part of a FHIR resource?",
    options: ["A) resourceType", "B) id", "C) extension", "D) xmlSchema", "E) meta"],
    correctAnswer: "D",
    explanation: "'xmlSchema' is not part of the standard FHIR resource structure."
  },
  {
    question: "What does the 'modifierExtension' element do?",
    options: ["A) Stores full-text narrative", "B) Changes the meaning of the base element", "C) Adds contact details", "D) Allows deletion of fields", "E) Stores security tags"],
    correctAnswer: "B",
    explanation: "modifierExtension modifies the meaning of the element it is attached to."
  },
  {
    question: "Which resource is used to advertise a server's conformance?",
    options: ["A) StructureDefinition", "B) CapabilityStatement", "C) ImplementationGuide", "D) OperationDefinition", "E) Provenance"],
    correctAnswer: "B",
    explanation: "The CapabilityStatement details the server’s capabilities."
  },
  {
    question: "Which FHIR resource is used to store lab test values?",
    options: ["A) Observation", "B) DiagnosticReport", "C) ServiceRequest", "D) Procedure", "E) CarePlan"],
    correctAnswer: "A",
    explanation: "Observation stores lab and clinical measurement values."
  },
  {
    question: "What does the 'Must Support' flag indicate in a FHIR profile?",
    options: ["A) The element must always appear", "B) Element is deprecated", "C) Clients must handle the element if present", "D) It enforces terminology", "E) It mandates resource creation"],
    correctAnswer: "C",
    explanation: "'Must Support' means the system must process the element if it appears."
  },
  {
    question: "Which is the foundational type all elements in FHIR extend from?",
    options: ["A) Resource", "B) DomainResource", "C) Element", "D) Base", "E) Component"],
    correctAnswer: "C",
    explanation: "All elements in FHIR ultimately extend from the 'Element' base type."
  },
  {
    question: "Which FHIR concept allows safe custom additions to standard resources?",
    options: ["A) Binding", "B) Constraint", "C) Extension", "D) Flag", "E) Modifier"],
    correctAnswer: "C",
    explanation: "Extensions are the official way to safely add custom data in FHIR."
  },
  {
    question: "Which of the following can be used to restrict which codes are allowed in an element?",
    options: ["A) ValueSet", "B) Extension", "C) ModifierExtension", "D) CapabilityStatement", "E) Narrative"],
    correctAnswer: "A",
    explanation: "ValueSet defines the list of valid codes that can be bound to coded elements."
  },
  {
    question: "What is the purpose of the StructureDefinition resource?",
    options: ["A) Describe implementation guides", "B) Define constraints and structure for resources", "C) Capture observations", "D) Store consent data", "E) Identify profiles"],
    correctAnswer: "B",
    explanation: "StructureDefinition is used to define the structure and constraints of FHIR resources."
  },
  {
    question: "What data formats does FHIR support natively?",
    options: ["A) CSV only", "B) JSON, XML, RDF", "C) YAML and XML", "D) YAML and JSON", "E) BSON and CSV"],
    correctAnswer: "B",
    explanation: "FHIR supports JSON, XML, and RDF (Turtle) as native serialization formats."
  },
  {
    question: "Which element in a Patient resource can have multiple values of the same type?",
    options: ["A) name", "B) birthDate", "C) gender", "D) deceased[x]", "E) id"],
    correctAnswer: "A",
    explanation: "The 'name' element in Patient can repeat to reflect multiple names."
  },
  {
    question: "Which element supports XHTML for narrative representation?",
    options: ["A) id", "B) text", "C) value", "D) name", "E) status"],
    correctAnswer: "B",
    explanation: "'text' element in DomainResource supports human-readable XHTML content."
  },
  {
    question: "Which of the following is true about FHIR resources?",
    options: ["A) They can only be used in HL7 v2 messages", "B) They are limited to XML only", "C) They can represent real-world clinical and administrative concepts", "D) They are read-only by default", "E) They can't be extended"],
    correctAnswer: "C",
    explanation: "Resources are the core units in FHIR that represent real-world healthcare concepts."
  }
];

const quizDiv = document.getElementById('quiz');
questions.forEach((q, index) => {
  const qDiv = document.createElement('div');
  qDiv.className = 'question';
  const qText = document.createElement('h3');
  qText.innerText = `${index + 1}. ${q.question}`;
  qDiv.appendChild(qText);

  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.textContent = opt;
    btn.onclick = () => {
      const selected = opt[0];
      if (selected === q.correctAnswer) {
        btn.classList.add('correct');
      } else {
        btn.classList.add('incorrect');
        const correctBtn = Array.from(qDiv.querySelectorAll('button')).find(b => b.textContent.startsWith(q.correctAnswer));
        correctBtn.classList.add('correct');
        const explanation = document.createElement('div');
        explanation.className = 'explanation';
        explanation.textContent = "Explanation: " + q.explanation;
        qDiv.appendChild(explanation);
      }
      qDiv.querySelectorAll('button').forEach(b => b.disabled = true);
    };
    qDiv.appendChild(btn);
  });

  quizDiv.appendChild(qDiv);
});
</script>

</body>
</html>
